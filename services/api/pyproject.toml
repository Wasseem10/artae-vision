[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "video-intelligence-api"
version = "0.9.0"
description = "FastAPI control plane for the AI video intelligence platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "alembic>=1.19,<2",
    "anyio>=4.4,<5",
    "boto3>=1.40,<2",
    "cryptography>=45,<47",
    "fastapi>=0.141,<1",
    "httpx>=0.28,<1",
    "openai>=2.0,<3",
    "pyjwt[crypto]>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy[asyncio]>=2.0.51,<3",
    "strands-agents>=1.55,<2",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.21,<1",
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[project.scripts]
video-intelligence-api = "video_intelligence_api.main:run_server"
video-intelligence-admin = "video_intelligence_api.admin:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
