[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "video-intelligence-inference"
version = "0.7.0"
description = "Tracked camera-to-action inference service for the AI video intelligence platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27,<1",
    "imageio-ffmpeg>=0.6,<1",
    "lap>=0.5.12,<1",
    "numpy>=1.26,<3",
    "opencv-python>=4.10,<5",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "ultralytics>=8.3,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[project.scripts]
video-intelligence-inference = "video_intelligence_inference.app:main"
video-intelligence-record = "video_intelligence_inference.recorder:main"
video-intelligence-agent = "video_intelligence_inference.agent:main"
video-intelligence-publish-file = "video_intelligence_inference.publisher:main"
video-intelligence-worker = "video_intelligence_inference.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
