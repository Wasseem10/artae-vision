name: Web quality
on:
  pull_request:
    paths: ["apps/web/**", "scripts/check-live-fall-demo.cjs", ".github/workflows/web-quality.yml"]
  push:
    branches: [main]
    paths: ["apps/web/**", "scripts/check-live-fall-demo.cjs", ".github/workflows/web-quality.yml"]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec next typegen
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify guest detection, evidence, and review during API failure
        env:
          ARTAE_TEST_URL: http://127.0.0.1:3100/live
          ARTAE_TEST_BROWSER: chromium
        run: |
          pnpm start --port 3100 > /tmp/artae-web.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/live > /dev/null; then break; fi
            sleep 1
          done
          pnpm test:live || { cat /tmp/artae-web.log; exit 1; }
